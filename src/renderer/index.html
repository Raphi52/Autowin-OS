<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Autowin OS</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self' data: blob:; object-src 'none'; base-uri 'none'"
    />
    <!--
      ÉTAT DE CHARGEMENT, écrit en HTML statique et NON en React.

      Mesuré au chronomètre sur deux lancements en mode dev, cache chaud : la fenêtre n'existe qu'à
      44 s, et React ne monte qu'à 70 s. Entre les deux, 26 secondes de fenêtre BLANCHE — c'est là
      qu'on relance l'application quatre fois en croyant qu'elle n'a pas démarré.

      Ce bloc doit rester du HTML statique : tout ce qui dépend du bundle React arriverait par
      définition APRÈS le moment qu'il s'agit de couvrir. Il vit DANS `#root`, donc React l'efface
      tout seul à son premier rendu — aucun code de nettoyage à maintenir, et aucun risque qu'il
      reste affiché par-dessus l'application.

      Les styles sont en ligne parce que la CSP autorise `style-src 'unsafe-inline'` mais pas une
      feuille externe servie avant le bundle.
    -->
    <style>
      #autowin-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b0d12;
        color: #f5f7fb;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      #autowin-boot .boot-name {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.92;
      }
      #autowin-boot .boot-rail {
        position: relative;
        width: 232px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(245 247 251 / 12%);
      }
      /* Barre INDÉTERMINÉE : le temps restant n'est pas connaissable depuis la page — le bundle qui
         le saurait n'est pas encore chargé. Une fausse progression chiffrée mentirait ; un va-et-vient
         dit « ça travaille » sans rien promettre. */
      #autowin-boot .boot-rail::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f7cff, #9b7cff);
        animation: autowin-boot-slide 1.15s ease-in-out infinite;
      }
      #autowin-boot .boot-step {
        font-size: 12px;
        color: rgb(245 247 251 / 55%);
      }
      @keyframes autowin-boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* Un utilisateur qui a demandé moins d'animation en obtient une barre fixe, pas un clignotement. */
      @media (prefers-reduced-motion: reduce) {
        #autowin-boot .boot-rail::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="autowin-boot" role="status" aria-live="polite" data-testid="autowin-boot">
        <span class="boot-name">Autowin OS</span>
        <div class="boot-rail"></div>
        <span class="boot-step">Chargement de l’interface…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
