<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Autowin OS</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self' data: blob:; object-src 'none'; base-uri 'none'"
    />
  </head>

  <body>
    <!--
      Le MÊME écran d'attente que celui du processus principal — voir `src/shared/boot-splash.ts`,
      qui explique pourquoi il en faut deux et quel trou chacun couvre. Un test compare les deux
      copies : ce fichier étant statique, il ne peut pas importer le module.

      Il vit DANS `#root` : React l'efface de lui-même à son premier rendu.
    -->
    <div id="root">
      <style>
        html,
        body {
          margin: 0;
          height: 100%;
          background: #000;
          color: #f5f7fb;
          font-family:
            'Segoe UI',
            system-ui,
            -apple-system,
            sans-serif;
          overflow: hidden;
        }
        #autowin-boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 26px;
          background: #000;
          animation: boot-in 0.45s ease both;
        }
        #autowin-boot .ring {
          width: 58px;
          height: 58px;
          animation: boot-turn 1.1s linear infinite;
        }
        #autowin-boot .ring circle {
          fill: none;
          stroke-width: 3.5;
          stroke-linecap: round;
        }
        #autowin-boot .track {
          stroke: rgba(245, 247, 251, 0.07);
        }
        #autowin-boot .arc-a {
          stroke: #e9bd4e;
          stroke-dasharray: 44 158;
        }
        #autowin-boot .arc-b {
          stroke: #9d79ed;
          stroke-dasharray: 30 172;
          stroke-dashoffset: -101;
        }
        #autowin-boot .name {
          font-size: 13px;
          font-weight: 500;
          letter-spacing: 0.24em;
          text-transform: uppercase;
          color: rgba(245, 247, 251, 0.86);
        }
        #autowin-boot .step {
          font-size: 12px;
          color: rgba(245, 247, 251, 0.34);
          letter-spacing: 0.01em;
        }
        @keyframes boot-turn {
          to {
            transform: rotate(360deg);
          }
        }
        @keyframes boot-in {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #autowin-boot .ring {
            animation-duration: 3s;
          }
          #autowin-boot {
            animation: none;
          }
        }
      </style>
      <div id="autowin-boot" role="status" aria-live="polite" data-testid="autowin-boot">
        <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="track" cx="32" cy="32" r="26"></circle>
          <circle class="arc-a" cx="32" cy="32" r="26"></circle>
          <circle class="arc-b" cx="32" cy="32" r="26"></circle>
        </svg>
        <span class="name">Autowin OS</span>
        <span class="step">Pr&eacute;paration de l&rsquo;interface&hellip;</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
