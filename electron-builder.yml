appId: com.amitel.autowin-os
productName: Autowin OS
directories:
  buildResources: build
files:
  - '!dist/**'
  - '!dist-*/**'
  - '!Audit/**'
  - '!artifacts/**'
  - '!.autowin-data/**'
  - '!sketches/**'
  - '!*.png'
  - '!.git/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/@napi-rs/keyring-*/**
  # PowerShell ne peut pas executer un fichier situe DANS l'archive asar : le script de lecture
  # d'Outlook doit exister sur le disque. Sans cette ligne, la passerelle marche en developpement et
  # est introuvable en package — le pire des deux mondes.
  - scripts/outlook-local-snapshot.ps1
  - scripts/outlook-local-open.ps1
  - scripts/outlook-local-reply.ps1
  - scripts/outlook-local-marquer-lu.ps1
  - scripts/outlook-local-nouveau.ps1
  # fix-ok: readBody (outlook-local.ts) lance ce script via resolveOutlookScriptPath, qui vise app.asar.unpacked ; dans dist/win-unpacked du 2026-09-23, un script non liste (ui-capture.mjs) reste DANS app.asar, un script liste (outlook-local-open.ps1) est extrait — sans cette ligne la relecture du mail entier echoue une fois l'app installee. Garde : outlook-local.test.ts « extrait de l archive » (rouge sans la ligne).
  - scripts/outlook-local-corps.ps1
  # Même contrainte pour la petite TV du bureau caché (src/main/hdesk-tv.ts).
  - scripts/hdesk-tv.ps1
  - scripts/hdesk-observe.ps1
  - scripts/hdesk-shot.cs
win:
  executableName: autowin-os
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Amitel
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
